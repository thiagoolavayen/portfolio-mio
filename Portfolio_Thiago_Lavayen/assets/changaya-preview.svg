<svg xmlns="http://www.w3.org/2000/svg" width="620" height="550" viewBox="0 0 620 550" role="img" aria-labelledby="t d"><title id="t">Maqueta conceptual de ChangaYa</title><desc id="d">Pantalla ficticia de una aplicación de servicios, con distintas categorías y una solicitud.</desc>
